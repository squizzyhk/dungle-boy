<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Orbital level kit</title>
<style>body{margin:0;background:#151b35;color:#f3eafa;font:16px system-ui}header{padding:24px 32px;background:#252b49}h1{margin:0 0 8px}p{color:#c2c7df}main{padding:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}article{border:1px solid #697196;border-radius:16px;overflow:hidden;background:#29324e}canvas{width:100%;background:linear-gradient(#323f64,#55426a)}h2,p.meta{margin:12px 18px}h2{font-size:18px}button,input{margin:0 12px}footer{padding:24px}</style>
<header><h1>Orbital level kit</h1><p>Eight reusable props · transparent sprites · fixed 256 px frames</p><button id="pause">Pause</button><label>Speed <input id="speed" type="range" min="0.1" max="2" value="1" step="0.1"></label><label><input id="bounds" type="checkbox">Frame bounds</label></header><main></main><footer>Artwork preview only. New hazard and power-up gameplay is not wired into existing levels.</footer>
<script type="module">
const manifest=await fetch('/assets/level-kit/manifest.json').then(r=>r.json());let paused=false,t=0,last=performance.now();
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play':'Pause'};
const entries=await Promise.all(manifest.assets.map(async a=>{const card=document.createElement('article');card.innerHTML=`<canvas width="320" height="290"></canvas><h2>${a.id.replaceAll('-',' ')}</h2><p class="meta">${a.frameCount} frame${a.frameCount>1?'s':''} · ${a.fps} fps · ${a.category}</p>`;document.querySelector('main').append(card);const image=new Image();image.src=a.url;await image.decode();return{a,image,c:card.querySelector('canvas').getContext('2d')}}));
function render(now){if(!paused)t+=(now-last)*Number(document.querySelector('#speed').value);last=now;for(const{a,image,c}of entries){const f=Math.floor(t/1000*a.fps)%a.frameCount;c.clearRect(0,0,320,290);c.drawImage(image,(f%a.columns)*256,Math.floor(f/a.columns)*256,256,256,32,8,256,256);if(document.querySelector('#bounds').checked){c.strokeStyle='#7bffe1';c.strokeRect(32,8,256,256)}c.fillStyle='#edf2ff';c.font='12px monospace';c.fillText(`frame ${f} / ${a.frameCount-1}`,14,280)}requestAnimationFrame(render)}requestAnimationFrame(render);
</script></html>
